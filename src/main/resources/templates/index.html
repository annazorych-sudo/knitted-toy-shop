<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>おもちゃショップ</title>
    <style>
        body {
            font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
            background-color: #f8f1e9;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .shop-info {
            background: #ffffff;
            border-radius: 14px;
            padding: 22px 28px;
            margin-bottom: 36px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        .shop-info table {
            border-collapse: collapse;
            font-size: 0.98rem;
        }
        .shop-info th {
            text-align: left;
            width: 90px;
            color: #777;
            font-weight: 500;
            padding: 5px 0;
        }
        .shop-info td {
            padding: 5px 0;
        }
        h2 {
            font-size: 1.35rem;
            margin-bottom: 20px;
        }
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 22px;
        }
        .product-card {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.07);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.12);
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            background: #eee;
        }
        .product-card .name {
            padding: 14px 16px 18px;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.35;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>おもちゃショップ</h1>

        <!-- 店舗情報 -->
        <div class="shop-info">
            <table>
                <tr>
                    <th>店名</th>
                    <td>おばあちゃんのおもちゃ屋さん</td>
                </tr>
                <tr>
                    <th>住所</th>
                    <td>東京都港区</td>
                </tr>
            </table>
        </div>

        <h2>おすすめ商品</h2>

        <!-- 商品一覧 -->
        <div class="product-list">
            <a class="product-card" th:href="@{/item/1}">
                <img src="/001.jpg" alt="人形の女の子">
                <div class="name">人形の女の子</div>
            </a>

            <a class="product-card" th:href="@{/item/2}">
                <img src="/002.jpg" alt="疲れたウサギ">
                <div class="name">疲れたウサギ</div>
            </a>

            <a class="product-card" th:href="@{/item/3}">
                <img src="/003.jpg" alt="眠りたいひよこ">
                <div class="name">眠りたいひよこ</div>
            </a>

            <a class="product-card" th:href="@{/item/4}">
                <img src="/004.jpg" alt="クレイジーハート">
                <div class="name">クレイジーハート</div>
            </a>
        </div>
    </div>

</body>
</html>
